<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jivaka Hospital Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            overflow: hidden;
        }
        .portal-bg {
            width: 100vw;
            height: 100vh;
            background-image: url('JVK Portal.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; /* Automatically scales and crops to fill mobile and PC screens without distortion */
        }
        
        /* Optional fallback for ultra-wide or specific mobile viewports */
        @media (max-width: 768px) {
            .portal-bg {
                background-size: cover;
            }
        }
    </style>
</head>
<body>
    <div class="portal-bg"></div>
</body>
</html>
